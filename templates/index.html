<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <title>Crypto Terminal</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&family=Fira+Code:wght@400;500&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-deep: #030712; /* Sangat gelap, hampir hitam */
      --glass-bg: rgba(17, 24, 39, 0.7); /* Transparan */
      --glass-border: rgba(255, 255, 255, 0.08);
      --primary: #6366f1; /* Indigo Modern */
      --primary-glow: rgba(99, 102, 241, 0.4);
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
      --input-bg: rgba(0, 0, 0, 0.3);
      --accent-cyan: #06b6d4;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: 'Plus Jakarta Sans', sans-serif;
      background-color: var(--bg-deep);
      color: var(--text-main);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      padding: 40px 20px;
      overflow-x: hidden;
      /* Ambient Background Glow - Modern Touch */
      background-image: 
        radial-gradient(circle at 15% 50%, rgba(99, 102, 241, 0.15), transparent 25%),
        radial-gradient(circle at 85% 30%, rgba(6, 182, 212, 0.15), transparent 25%);
    }

    .container {
      width: 100%;
      max-width: 1100px;
      position: relative;
      z-index: 1;
    }

    /* Header Styling */
    .header {
      text-align: center;
      margin-bottom: 50px;
    }

    h1 {
      font-size: 2.5rem;
      font-weight: 800;
      letter-spacing: -0.03em;
      background: linear-gradient(to right, #fff, #94a3b8);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      margin-bottom: 10px;
    }

    .subtitle {
      font-size: 1rem;
      color: var(--text-muted);
      font-weight: 500;
    }

    /* GLASS CARD DESIGN */
    .card {
      background: var(--glass-bg);
      backdrop-filter: blur(20px); /* Efek Kaca Buram */
      -webkit-backdrop-filter: blur(20px);
      border: 1px solid var(--glass-border);
      border-radius: 24px;
      padding: 40px;
      box-shadow: 
        0 25px 50px -12px rgba(0, 0, 0, 0.5), 
        inset 0 1px 0 rgba(255, 255, 255, 0.1); /* Inner Highlight */
    }

    .grid {
      display: grid;
      grid-template-columns: 1fr;
      gap: 40px;
    }

    @media (min-width: 850px) {
      .grid { grid-template-columns: 1fr 1fr; }
    }

    /* Badges */
    .badge-container {
      display: flex;
      gap: 12px;
      margin-bottom: 30px;
    }

    .badge {
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid var(--glass-border);
      padding: 6px 14px;
      border-radius: 50px;
      font-size: 0.75rem;
      font-weight: 600;
      letter-spacing: 0.05em;
      color: var(--accent-cyan);
      text-transform: uppercase;
    }

    /* Inputs */
    .field-group { margin-bottom: 24px; }

    label {
      display: block;
      font-size: 0.85rem;
      font-weight: 600;
      color: var(--text-muted);
      margin-bottom: 10px;
      letter-spacing: 0.02em;
    }

    select, input, textarea {
      width: 100%;
      background: var(--input-bg);
      border: 1px solid var(--glass-border);
      border-radius: 12px;
      padding: 14px 16px;
      color: white;
      font-family: 'Plus Jakarta Sans', sans-serif;
      font-size: 0.95rem;
      transition: all 0.3s ease;
      box-shadow: inset 0 2px 4px rgba(0,0,0,0.2);
    }

    input[type="text"], input[type="number"], textarea {
      font-family: 'Fira Code', monospace; /* Monospace for code feel */
    }

    select:focus, input:focus, textarea:focus {
      outline: none;
      border-color: var(--primary);
      box-shadow: 0 0 0 4px rgba(99, 102, 241, 0.15);
      background: rgba(0,0,0,0.5);
    }

    textarea {
      min-height: 160px;
      resize: vertical;
      line-height: 1.6;
    }

    .alg-note {
      margin-top: 8px;
      font-size: 0.8rem;
      color: var(--text-muted);
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .alg-note::before { content: "ℹ"; color: var(--primary); }

    /* Buttons */
    .btn-row {
      display: flex;
      gap: 16px;
      margin-top: 32px;
      flex-wrap: wrap;
    }

    button {
      padding: 14px 28px;
      border-radius: 12px;
      font-weight: 600;
      font-size: 0.95rem;
      cursor: pointer;
      transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
      font-family: 'Plus Jakarta Sans', sans-serif;
    }

    .primary {
      background: linear-gradient(135deg, var(--primary), #4f46e5);
      color: white;
      border: 1px solid rgba(255,255,255,0.1);
      box-shadow: 0 4px 15px var(--primary-glow);
    }

    .primary:hover {
      transform: translateY(-2px);
      box-shadow: 0 8px 25px var(--primary-glow);
    }

    .secondary {
      background: rgba(255,255,255,0.05);
      color: var(--text-main);
      border: 1px solid var(--glass-border);
    }

    .secondary:hover {
      background: rgba(255,255,255,0.1);
      border-color: var(--text-muted);
    }

    /* Output Window */
    .output-section {
      display: flex;
      flex-direction: column;
      height: 100%;
    }

    .output-box {
      background: #0b101b; /* Darker solid background for contrast */
      border: 1px solid var(--glass-border);
      border-radius: 16px;
      padding: 24px;
      flex-grow: 1;
      font-family: 'Fira Code', monospace;
      font-size: 0.95rem;
      color: #a5b4fc; /* Soft Indigo text */
      white-space: pre-wrap;
      word-break: break-word;
      position: relative;
      overflow: hidden;
    }

    /* Decorative Mac-like dots for output window */
    .output-box::before {
      content: "•••";
      position: absolute;
      top: 15px;
      right: 20px;
      letter-spacing: 2px;
      color: rgba(255,255,255,0.2);
      font-size: 20px;
      line-height: 0;
    }

    .footer {
      margin-top: 30px;
      border-top: 1px solid var(--glass-border);
      padding-top: 20px;
      font-size: 0.85rem;
      color: var(--text-muted);
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    a { text-decoration: none; }
    
    .error {
        background: rgba(239, 68, 68, 0.15);
        border: 1px solid rgba(239, 68, 68, 0.3);
        color: #fca5a5;
        padding: 15px;
        border-radius: 12px;
        margin-bottom: 20px;
        font-size: 0.9rem;
        display: flex;
        align-items: center;
        gap: 10px;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="header">
      <h1>Cryptographic Engine</h1>
      <div class="subtitle">Secure Simulation Environment</div>
    </div>

    <div class="card">
      <div class="badge-container">
        <div class="badge">System Active</div>
        <div class="badge">Python v3.x</div>
        <div class="badge">Secure</div>
      </div>

      {% if error %}
      <div class="error">
          <svg width="20" height="20" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8v4m0 4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>
          {{ error }}
      </div>
      {% endif %}

      <form method="POST" action="{{ url_for('index') }}">
        <div class="grid">
          <div>
            <div class="field-group">
              <label for="algorithm">Select Algorithm</label>
              <select id="algorithm" name="algorithm" onchange="updateKeyLabel()">
                <option value="caesar" {% if algorithm == "caesar" %}selected{% endif %}>Caesar Cipher</option>
                <option value="vigenere" {% if algorithm == "vigenere" %}selected{% endif %}>Vigenère Cipher</option>
                <option value="railfence" {% if algorithm == "railfence" %}selected{% endif %}>Rail Fence Cipher</option>
              </select>
              <p class="alg-note" id="alg-note">...</p>
            </div>

            <div class="field-group">
              <label for="mode">Operation Mode</label>
              <select id="mode" name="mode">
                <option value="encrypt" {% if mode == "encrypt" %}selected{% endif %}>Encrypt (Lock Data)</option>
                <option value="decrypt" {% if mode == "decrypt" %}selected{% endif %}>Decrypt (Unlock Data)</option>
              </select>
            </div>

            <div class="field-group" id="key-wrapper">
              <label id="key-label" for="key">Key Parameter</label>
              <input
                id="key"
                name="key"
                type="{% if algorithm == 'vigenere' %}text{% else %}number{% endif %}"
                value="{{ key or '' }}"
                placeholder="Enter key..."
                autocomplete="off"
              />
            </div>

            <div class="field-group">
              <label for="text">Input Payload</label>
              <textarea
                id="text"
                name="text"
                placeholder="Type or paste your message here..."
              >{{ text or "" }}</textarea>
            </div>

            <div class="btn-row">
              <button class="primary" type="submit">Execute Protocol</button>
              <button class="secondary" type="reset" onclick="resetOutput()">Reset</button>
              
              <a href="{{ url_for('soal') }}" style="margin-left: auto; width: 100%; flex: 1; min-width: 200px;">
                 <button class="secondary" type="button" style="width: 100%; border-color: var(--primary); color: var(--primary);">
                  Mission Files &rarr;
                </button>
              </a>
            </div>
          </div>

          <div class="output-section">
            <label>Terminal Output</label>
            <div id="output" class="output-box">{% if result %}{{ result }}{% else %}<span style="color: #5f6c7b">// System Ready...
// Waiting for input parameters.</span>{% endif %}</div>
          </div>
        </div>
      </form>

      <div class="footer">
        <span>&copy; Cryptography Lab</span>
        <span>Secure Connection</span>
      </div>
    </div>
  </div>

  <script>
    function updateKeyLabel() {
      const alg = document.getElementById("algorithm").value;
      const keyLabel = document.getElementById("key-label");
      const keyInput = document.getElementById("key");
      const note = document.getElementById("alg-note");

      if (alg === "caesar") {
        keyLabel.textContent = "Shift Amount (Number)";
        keyInput.type = "number";
        keyInput.placeholder = "e.g. 3";
        note.textContent = "Shifts the alphabet by N positions.";
      } else if (alg === "vigenere") {
        keyLabel.textContent = "Passphrase (Text)";
        keyInput.type = "text";
        keyInput.placeholder = "e.g. SECRET";
        note.textContent = "Uses a keyword to shift letters dynamically.";
      } else {
        keyLabel.textContent = "Rail Height (Number)";
        keyInput.type = "number";
        keyInput.placeholder = "e.g. 3";
        note.textContent = "Zig-zag pattern height (min 2).";
      }
    }

    function resetOutput() {
      const out = document.getElementById("output");
      out.innerHTML = '<span style="color: #5f6c7b">// System Ready...\n// Waiting for input parameters.</span>';
    }
    updateKeyLabel();
  </script>
</body>
</html>
